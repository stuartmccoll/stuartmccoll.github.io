{{ define "main" }}
<section class="error-page">
    <div class="wrap">
        <p class="eyebrow">Error 404</p>
        <h1>Page not found</h1>
        <p>The page you asked for doesn't exist, or it has moved.</p>
        <div class="actions">
            <a class="btn btn-primary" href="{{ "/" | relURL }}">Go to the home page</a>
            <a class="btn btn-secondary" href="{{ "/posts/" | relURL }}">Browse all posts</a>
        </div>
    </div>
</section>
{{ end }}
