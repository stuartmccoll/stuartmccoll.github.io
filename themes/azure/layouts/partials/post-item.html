<li class="post-item" data-tags="{{ range .Params.tags }}{{ urlize . }} {{ end }}">
    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 Jan 2006" }}</time>
    <div>
        <h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
        <div class="meta">
            {{- with .Params.resourceType }}<span class="rtype">{{ . }}</span>{{ end }}
            {{- with .Params.tags }}{{ range first 2 . }}<a class="tag" href="{{ printf "/tags/%s/" (urlize .) | relURL }}">{{ . }}</a>{{ end }}{{ end }}
        </div>
    </div>
</li>
