<!DOCTYPE html>
<html lang="en-GB">
<head>
    <script>
        (function () {
            try {
                var scheme = localStorage.getItem('theme');
                if (scheme && scheme !== 'system') document.documentElement.setAttribute('data-theme', scheme);
            } catch (e) {}
        })();
    </script>
    {{ partial "head.html" . }}
</head>
<body>
    <a class="skip-link" href="#main">Skip to content</a>
    {{ partial "topbar.html" . }}
    <main id="main" class="site-main">
        {{ block "main" . }}{{ end }}
    </main>
    {{ partial "footer.html" . }}
    {{ $js := resources.Get "js/main.js" | resources.Minify | resources.Fingerprint }}
    <script src="{{ $js.RelPermalink }}"></script>
</body>
</html>
