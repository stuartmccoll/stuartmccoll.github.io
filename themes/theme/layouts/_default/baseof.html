<!DOCTYPE html>
<html lang="en-GB">

    <head>
        <script>
            (function() {
                var theme = localStorage.getItem('theme');
                if (theme) {
                    document.documentElement.setAttribute('data-theme', theme);
                }
            })();
        </script>
        {{ partial "head.html" . }}
    </head>

    <body>
        <div class="accent-bar"></div>
        {{ partial "header.html" . }}
        <div class="container">
            <div class="content">
                {{ block "main" . }}{{ end }}
            </div>

            {{ block "footer" . }}

            {{ partial "footer.html" . }}

            {{ end }}
        </div>

        <script>
            (function() {
                // Theme picker
                var toggle = document.querySelector('.theme-picker-toggle');
                var dropdown = document.querySelector('.theme-picker-dropdown');
                if (!toggle || !dropdown) return;

                toggle.addEventListener('click', function(e) {
                    e.stopPropagation();
                    var isOpen = dropdown.classList.contains('is-open');
                    dropdown.classList.toggle('is-open');
                    toggle.setAttribute('aria-expanded', !isOpen);
                });

                dropdown.addEventListener('click', function(e) {
                    var btn = e.target.closest('[data-set-theme]');
                    if (!btn) return;
                    var theme = btn.getAttribute('data-set-theme');
                    document.documentElement.setAttribute('data-theme', theme);
                    localStorage.setItem('theme', theme);
                    dropdown.classList.remove('is-open');
                    toggle.setAttribute('aria-expanded', 'false');
                });

                document.addEventListener('click', function(e) {
                    if (!e.target.closest('.theme-picker')) {
                        dropdown.classList.remove('is-open');
                        toggle.setAttribute('aria-expanded', 'false');
                    }
                });

                // Reading progress
                var progress = document.querySelector('.reading-progress');
                if (progress) {
                    window.addEventListener('scroll', function() {
                        var docHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
                        if (docHeight <= 0) return;
                        var scrolled = (window.scrollY / docHeight) * 100;
                        progress.style.width = scrolled + '%';
                    });
                }

                // Load more posts
                var moreBtn = document.querySelector('.posts-more-btn');
                if (moreBtn) {
                    moreBtn.addEventListener('click', function() {
                        var hidden = document.querySelectorAll('.posts-item.is-hidden');
                        for (var i = 0; i < 12 && i < hidden.length; i++) {
                            hidden[i].classList.remove('is-hidden');
                        }
                        if (document.querySelectorAll('.posts-item.is-hidden').length === 0) {
                            moreBtn.parentElement.style.display = 'none';
                        }
                    });
                }
            })();
        </script>
    </body>

</html>
