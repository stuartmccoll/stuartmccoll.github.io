<header class="site-header">
    <div class="header-inner">
        <div class="site-branding">
            <a href="/" class="site-title">{{ .Site.Params.Title }}</a>
            <p class="site-tagline">Thoughts on Windows, Azure, PowerShell, and more.</p>
        </div>
        <nav>
            <ul>
                <li><a class="nav-link" href="/">Blog</a></li>
                <li><a class="nav-link" href="/about">About</a></li>
                <li>
                    <div class="theme-picker">
                        <button class="theme-picker-toggle" aria-label="Change theme" aria-expanded="false">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 2a7 7 0 0 0 0 20 10 10 0 0 0 0-20z" fill="currentColor" opacity="0.3"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                        <div class="theme-picker-dropdown">
                            <button data-set-theme="azure-light"><span class="theme-swatch" style="background: linear-gradient(135deg, #0068c9, #2b88d8)"></span> Azure (Light)</button>
                            <button data-set-theme="azure-dark"><span class="theme-swatch" style="background: linear-gradient(135deg, #4dacff, #7cc3ff)"></span> Azure (Dark)</button>
                            <button data-set-theme="masterchief-light"><span class="theme-swatch" style="background: linear-gradient(135deg, #4b7a2e, #7aa93e)"></span> Master Chief (Light)</button>
                            <button data-set-theme="masterchief-dark"><span class="theme-swatch" style="background: linear-gradient(135deg, #7aa93e, #9ecc5a)"></span> Master Chief (Dark)</button>
                            <button data-set-theme="cortana-light"><span class="theme-swatch" style="background: linear-gradient(135deg, #7b4bb5, #a06cdd)"></span> Cortana (Light)</button>
                            <button data-set-theme="cortana-dark"><span class="theme-swatch" style="background: linear-gradient(135deg, #a06cdd, #c49bf5)"></span> Cortana (Dark)</button>
                        </div>
                    </div>
                </li>
            </ul>
        </nav>
    </div>
    {{ if and .IsPage (eq .Section "posts") }}<div class="reading-progress"></div>{{ end }}
</header>
