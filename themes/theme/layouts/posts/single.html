{{ define "main" }}
<main class="post post--wide">

    <article>
        <header class="post-header header-pattern-{{ mod (len .Title) 4 }}">
            <h1 class="post-title">{{ .Title | markdownify }}</h1>
            <div class="post-meta">
                <time class="post-date" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>
                {{ with .Params.categories }}
                <div class="post-categories">
                    {{ range . }}<span class="post-category">{{ . }}</span>{{ end }}
                </div>
                {{ end }}
            </div>
        </header>

        <div class="post-content">
            {{ .Content }}
        </div>
    </article>

</main>
{{ end }}
